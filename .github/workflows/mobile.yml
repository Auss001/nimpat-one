# Builds the Nimpat One phone apps in the cloud (this project has no Mac and no Android tools locally).
#   Android: a test APK to install on a phone, from every run. With the release key secrets set, also a signed
#            bundle (.aab) ready for Google Play.
#   iPhone:  always checks that the app builds. With the App Store Connect secrets set (they are, since 8 Nov 2026), it signs the app
#            (automatic signing needs at least one registered iPhone on the developer account; one is registered)
#            and sends it to TestFlight.
# Run it from GitHub: Actions → "Phone apps" → Run workflow (or "Re-run all jobs" on a run). It also runs when the customer app changes on main.
name: Phone apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/mobile.yml']

concurrency:
  group: phone-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:native
      - name: Check the app knows where the API is
        run: |
          if ! grep -qE "run[.]app|api[.]nimpatgroup[.]com" dist/assets/*.js; then
            echo "No API address in the build. Is app/.env.native committed?"
            exit 1
          fi
      - run: npx cap sync android
      - name: Test app (APK)
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: nimpat-one-android-test-${{ env.VERSION_NAME }}
          path: app/android/app/build/outputs/apk/debug/*.apk
      - name: Signed bundle for Google Play (when the release key is set)
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Each check reports in plain words as a run annotation (visible on the run page); no secret is ever printed.
        # Stray spaces and line breaks from copy-and-paste are removed first.
        run: |
          set -uo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          STORE_PASS="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '[:space:]')"
          KEY_PASS="$(printf '%s' "$KEY_PASSWORD" | tr -d '[:space:]')"
          ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')"
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
            echo "::error title=Play key::ANDROID_KEYSTORE_BASE64 is not a valid key. Copy the long line under its name in secrets.txt again, all of it."
            exit 1
          fi
          echo "Key file: $(wc -c < "$KS") bytes"
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASS" > /dev/null 2>&1; then
            echo "::error title=Play key::ANDROID_KEYSTORE_PASSWORD does not open the key. Copy the value under its name in secrets.txt again."
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error title=Play key::ANDROID_KEY_ALIAS is not in the key. It should be: nimpat-upload"
            exit 1
          fi
          echo "Key checks passed."
          if ! ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" > "$RUNNER_TEMP/bundle.log" 2>&1; then
            tail -40 "$RUNNER_TEMP/bundle.log"
            reason="$(grep -m1 -E 'What went wrong|error:|Execution failed' -A2 "$RUNNER_TEMP/bundle.log" | tr '\n' ' ' | cut -c1-400)"
            echo "::error title=Play bundle::${reason:-The signed build failed; see the log above.}"
            exit 1
          fi
          tail -5 "$RUNNER_TEMP/bundle.log"
      - uses: actions/upload-artifact@v5
        if: ${{ hashFiles('app/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: nimpat-one-android-play-${{ env.VERSION_NAME }}
          path: app/android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build:native
      - name: Check the app knows where the API is
        run: |
          if ! grep -qE "run[.]app|api[.]nimpatgroup[.]com" dist/assets/*.js; then
            echo "No API address in the build. Is app/.env.native committed?"
            exit 1
          fi
      - run: npx cap sync ios
      - name: Add the Firebase file to the iPhone project (notifications)
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby ios/scripts/add-firebase-plist.rb
      - name: Check that the iPhone app builds
        if: ${{ env.ASC_KEY_ID == '' }}
        working-directory: app/ios/App
        shell: bash
        run: |
          set -uo pipefail
          if ! xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator \
               -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:|\*\* BUILD FAILED" "$RUNNER_TEMP/build.log" | head -15
            echo "::error title=iPhone build::$(grep -m1 -E 'error:' "$RUNNER_TEMP/build.log" | cut -c1-400)"
            exit 1
          fi
          tail -3 "$RUNNER_TEMP/build.log"
      # Each failure shows Apple's own message as a run annotation (visible on the run page). No secret is printed.
      - name: Sign and send to TestFlight
        if: ${{ env.ASC_KEY_ID != '' }}
        working-directory: app/ios/App
        shell: bash
        run: |
          set -uo pipefail
          KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ISSUER="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          TEAM="$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')"
          KEY_PATH="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          # Accept the key with or without its BEGIN/END lines and with any line breaks; rebuild the standard .p8 layout.
          BODY="$(printf '%s' "$ASC_KEY" | sed -e 's/-----[A-Z ]*-----//g' | tr -d '[:space:]')"
          if [ "${#BODY}" -lt 150 ] || ! printf '%s' "$BODY" | base64 -d > /dev/null 2>&1; then
            echo "::error title=TestFlight::APP_STORE_CONNECT_KEY_P8 is not the .p8 key: it holds ${#BODY} usable characters, and the key has about 200. Open the AuthKey_….p8 file in Notepad, copy all of it, and update the secret."
            exit 1
          fi
          { echo '-----BEGIN PRIVATE KEY-----'; printf '%s' "$BODY" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          fail() {
            grep -E "error:|\*\* (ARCHIVE|EXPORT) FAILED|No profiles|No Accounts|not (be )?found|Authentication" "$1" | head -20
            echo "::error title=$2::$(grep -m1 -E 'error:|No profiles|No Accounts|Authentication' "$1" | cut -c1-500)"
            exit 1
          }
          echo "Archiving (signing as team $TEAM)…"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 "${AUTH[@]}" archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || fail "$RUNNER_TEMP/archive.log" "iPhone archive"
          tail -3 "$RUNNER_TEMP/archive.log"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          echo "Uploading to App Store Connect (TestFlight)…"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" > "$RUNNER_TEMP/export.log" 2>&1 || fail "$RUNNER_TEMP/export.log" "TestFlight upload"
          tail -5 "$RUNNER_TEMP/export.log"
          echo "::notice title=TestFlight::Build ${{ github.run_number }} uploaded. It appears in App Store Connect > TestFlight after Apple processes it (about 10 to 30 minutes)."
